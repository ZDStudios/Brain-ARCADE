name: Build Brain Arcade APK

on:
  push:
    branches:
      - main
    paths:
      - 'BrainGames/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BrainGames

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk ../out/BrainArcade-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrainArcade-debug-apk
          path: out/BrainArcade-debug.apk
          if-no-files-found: error

      - name: Publish to a release (every main build + manual run)
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: brain-arcade-latest
          name: Brain Arcade (latest debug build)
          files: out/BrainArcade-debug.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Announce the new version only AFTER the APK is actually downloadable.
      # app-latest.json is read straight from the repo, so bumping it in the same
      # commit as the code advertised a version minutes before the matching APK
      # had finished uploading. The app then downloaded the previous build, which
      # installs "successfully" but changes nothing — and it re-offered the same
      # update on every launch. Writing the file here closes that window.
      - name: Point app-latest.json at the build just published
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        continue-on-error: true
        run: |
          set -e
          VC=$(sed -n 's/.*versionCode \([0-9]\+\).*/\1/p' BrainGames/app/build.gradle | head -1)
          VN=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' BrainGames/app/build.gradle | head -1)
          echo "built versionCode=$VC versionName=$VN"
          python3 - "$VC" "$VN" <<'PY'
          import json, sys
          p = 'app-latest.json'
          d = json.load(open(p))
          d['versionCode'] = int(sys.argv[1])
          d['versionName'] = sys.argv[2]
          with open(p, 'w') as f:
              json.dump(d, f, indent=2)
              f.write('\n')
          PY
          if git diff --quiet app-latest.json; then
            echo "app-latest.json already points at this build"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app-latest.json
          git commit -m "chore: announce $VN (build $VC) now the APK is published [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && break
            echo "push attempt $i failed, retrying"; sleep 5
          done
