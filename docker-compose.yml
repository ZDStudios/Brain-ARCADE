# Brain Arcade control server — Docker Compose (works with Coolify's
# "Docker Compose" deploy type, or plain `docker compose up -d` on any VPS).
services:
  control:
    build:
      context: .
      dockerfile: Dockerfile
    # Or pull a prebuilt image instead of building:
    # image: ghcr.io/zdstudios/brain-arcade-control:latest
    restart: unless-stopped
    init: true
    environment:
      # Dashboard password: needed for EVERYTHING on the dashboard. Set your own;
      # if left empty a strong one is generated, kept in /data and printed in the log.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      PORT: "3000"
      DATA_DIR: /data
    volumes:
      # Keeps device locks, allow-lists and score backups across redeploys.
      - brain-arcade-data:/data
    # Not published to the internet on purpose: Coolify's proxy reaches it on its
    # private network and adds HTTPS, so all traffic is encrypted. (Publishing
    # 3000 would let anyone skip HTTPS.) For a plain `docker compose up` on a
    # machine without a proxy, replace `expose` with  ports: ["3000:3000"].
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/ping"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  brain-arcade-data:
